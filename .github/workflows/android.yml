name: Android Build APK

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    
  # Dòng này giúp bạn bấm nút "Run workflow" để build thủ công bất cứ lúc nào
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Nên dùng cho Element X)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        # Lệnh này chuyên dụng để tạo file APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        # Bước này cực kỳ quan trọng để bạn có thể tải file về
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
